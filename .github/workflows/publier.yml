name: Assemblage et publication de finvd.ch

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 3 * * *"   # chaque nuit : reprend la dernière version de chaque site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  assembler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assembler les sites
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    # Ne publie que si le dépôt est public (GitHub Pages indisponible en privé sur un compte gratuit)
    if: github.event.repository.private == false
    needs: assembler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
